name: Release On-Demand

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract Version
        id: version
        run: |
          VERSION=$(grep '#define PKGMGR_VERSION' include/version.h | awk '{print $3}' | tr -d '"' | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "Error: Could not find PKGMGR_VERSION in include/version.h"
            exit 1
          fi
          echo "Extracted version: $VERSION"
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Aborting."
            exit 1
          fi
          echo "Release $TAG does not exist. Proceeding."

      - name: Build PKG Manager
        run: |
          chmod +x build_release.sh
          ./build_release.sh
          SHORT_HASH=$(git rev-parse --short HEAD)
          mv "pkg-manager_v${{ steps.version.outputs.version }}-dev-${SHORT_HASH}.elf" \
             "pkg-manager_v${{ steps.version.outputs.version }}.elf"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            NOTES="Full Changelog: https://github.com/${{ github.repository }}/compare/$PREV_TAG...$TAG"
          else
            NOTES="First Release."
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            "pkg-manager_v${VERSION}.elf"
